name: hermes-companion-pair
version: "0.1.0"
description: |
  One-scan QR pairing for Hermes Agent: pair your phone to your Hermes host
  with a single QR scan. Issues per-device revocable credentials, adds a
  dashboard Companion tab and `hermes companion` CLI commands. No extra
  daemon, no cloud relay.
author: Rishab Deol
license: MIT
homepage: https://github.com/rishabh-alt/hermes-companion-pair
# NOTE: process-spawning for dashboard supervision (spec §5.6) is declared
# in README/NOTES for now; it returns to this manifest once the
# `hermes plugins validate` schema for capabilities is confirmed, so the
# manifest stays parseable on every Hermes version in the 0.20.0-0.22.x floor.
